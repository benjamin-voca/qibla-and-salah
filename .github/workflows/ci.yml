name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CIQ_SDK_VERSION: "9.3.0"
  SDK_MANAGER_VERSION: "0.8.4"
  # sha256 of connect-iq-sdk-manager-cli_<version>_Linux_x86_64.tar.gz (from the release's checksums.txt)
  SDK_MANAGER_SHA256: "5d57b8f9cfcd02d3b3f48e19d6daca0480e4c6f627926f15d8617ef8a6f57e0b"

jobs:
  # Pure-Python reference implementation + property tests. Needs nothing from Garmin,
  # so it runs everywhere (including pull requests from forks).
  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python3 -m unittest discover -s tests -v

  # Build for every watch and run the Monkey C unit/property tests in the real
  # Connect IQ simulator (headless, Xvfb).
  #
  # Garmin only serves the SDK and device files to signed-in developers, so this job
  # uses secrets. They are protected in several layers:
  #   * they live in the "garmin" environment, which only the main branch may use
  #     (no repository-level copies), so other branches and pull requests can't read them;
  #   * the job only runs for pushes to main and manual runs, never for pull requests
  #     (fork pull requests never get secrets from GitHub anyway, and this workflow does
  #     not use pull_request_target);
  #   * each secret is only exposed to the single step that needs it;
  #   * every action is pinned to a commit and the downloaded CLI is checksum-verified.
  # Environment secrets:
  #   GARMIN_USERNAME, GARMIN_PASSWORD  - Garmin account (without 2-step verification)
  #   DEVELOPER_KEY_B64 (optional)      - base64 of the DER signing key; else a throwaway key
  watch:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04   # the simulator needs libwebkit2gtk-4.0, which 24.04 dropped
    environment: garmin
    steps:
      - name: Check for Garmin credentials
        id: creds
        env:
          GARMIN_USERNAME: ${{ secrets.GARMIN_USERNAME }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
        run: |
          if [ -n "$GARMIN_USERNAME" ] && [ -n "$GARMIN_PASSWORD" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Garmin secrets not available - skipping watch build and simulator tests."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.creds.outputs.ok == 'true'

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        if: steps.creds.outputs.ok == 'true'
        with:
          distribution: temurin
          java-version: "17"

      - name: Install simulator dependencies
        if: steps.creds.outputs.ok == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libwebkit2gtk-4.0-37 libusb-1.0-0 libsecret-1-0 libjpeg8 libsm6 libxxf86vm1 \
            libgtk-3-0 libnotify4 fonts-dejavu-core

      # Only SDK/device/font files are cached - never ~/.Garmin/ConnectIQ as a whole,
      # which also holds the Garmin login token (token.json): caches saved on main
      # can be restored by pull request runs.
      - name: Cache Connect IQ SDK and device files
        if: steps.creds.outputs.ok == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.Garmin/ConnectIQ/Sdks
            ~/.Garmin/ConnectIQ/Devices
            ~/.Garmin/ConnectIQ/Fonts
          key: ciq-${{ env.CIQ_SDK_VERSION }}-${{ hashFiles('manifest.xml') }}
          restore-keys: ciq-${{ env.CIQ_SDK_VERSION }}-

      - name: Install the Connect IQ SDK manager CLI
        if: steps.creds.outputs.ok == 'true'
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o "$RUNNER_TEMP/cli.tgz" "https://github.com/lindell/connect-iq-sdk-manager-cli/releases/download/v${SDK_MANAGER_VERSION}/connect-iq-sdk-manager-cli_${SDK_MANAGER_VERSION}_Linux_x86_64.tar.gz"
          echo "${SDK_MANAGER_SHA256}  $RUNNER_TEMP/cli.tgz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/cli.tgz" -C "$HOME/.local/bin" connect-iq-sdk-manager
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Download SDK and device files
        if: steps.creds.outputs.ok == 'true'
        env:
          GARMIN_USERNAME: ${{ secrets.GARMIN_USERNAME }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
        run: |
          # The account owner has accepted the Connect IQ SDK license; accept the current
          # version of it for this CI machine as well.
          HASH=$(connect-iq-sdk-manager agreement view | sed -n 's/^Current Hash: //p')
          connect-iq-sdk-manager agreement accept --agreement-hash="$HASH"
          connect-iq-sdk-manager login
          connect-iq-sdk-manager sdk set "$CIQ_SDK_VERSION"
          connect-iq-sdk-manager device download --manifest manifest.xml --include-fonts
          echo "$(connect-iq-sdk-manager sdk current-path)/bin" >> "$GITHUB_PATH"
          # Don't leave the Garmin login token on disk for the remaining steps (or the cache).
          rm -f "$HOME/.Garmin/ConnectIQ/token.json"

      - name: Signing key
        if: steps.creds.outputs.ok == 'true'
        env:
          DEVELOPER_KEY_B64: ${{ secrets.DEVELOPER_KEY_B64 }}
        run: |
          if [ -n "$DEVELOPER_KEY_B64" ]; then
            echo "$DEVELOPER_KEY_B64" | base64 -d > "$RUNNER_TEMP/key.der"
          else
            openssl genrsa -out "$RUNNER_TEMP/key.pem" 4096
            openssl pkcs8 -topk8 -inform PEM -outform DER -in "$RUNNER_TEMP/key.pem" -out "$RUNNER_TEMP/key.der" -nocrypt
          fi

      - name: Check monkey.jungle is up to date
        if: steps.creds.outputs.ok == 'true'
        run: |
          python3 tools/gen_jungle.py
          git diff --exit-code monkey.jungle

      - name: Build unit tests
        if: steps.creds.outputs.ok == 'true'
        run: |
          mkdir -p bin
          for d in vivoactive5 fr245; do
            monkeyc -f monkey.jungle -d "$d" -y "$RUNNER_TEMP/key.der" -o "bin/test-$d.prg" --unit-test
          done

      - name: Run unit and property tests in the simulator
        if: steps.creds.outputs.ok == 'true'
        run: |
          Xvfb :99 -screen 0 1280x1024x24 -nolisten tcp &
          export DISPLAY=:99
          simulator > simulator.log 2>&1 &
          for _ in $(seq 120); do ss -ltn | grep -q ':1234 ' && break; sleep 1; done
          status=0
          for d in vivoactive5 fr245; do
            echo "::group::tests on $d"
            monkeydo "bin/test-$d.prg" "$d" -t | tee "test-$d.log"
            echo "::endgroup::"
            grep -q '^PASSED' "test-$d.log" || { echo "::error::tests failed on $d"; status=1; }
          done
          exit $status

      - name: Build the store package for all watches
        if: steps.creds.outputs.ok == 'true'
        run: monkeyc -e -r -f monkey.jungle -y "$RUNNER_TEMP/key.der" -o bin/QiblaSalah.iq

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.creds.outputs.ok == 'true'
        with:
          name: QiblaSalah-iq
          path: bin/QiblaSalah.iq

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && steps.creds.outputs.ok == 'true'
        with:
          name: simulator-logs
          path: |
            simulator.log
            test-*.log
          if-no-files-found: ignore
